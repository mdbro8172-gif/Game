 const fr=new T.Group();for(let i=0;i<14;i++){const a=i*2.4,d=R(.7,2.3),y=R(4.3,5.2),m=new T.Mesh(new T.SphereGeometry(r,10,8),new T.MeshLambertMaterial({color,emissive:color,emissiveIntensity:.25}));m.position.set(Math.cos(a)*d,y,Math.sin(a)*d);m.scale.y=1.25;fr.add(m);cyl(.02,.02,5.6-y,0x4a6b1f,Math.cos(a)*d,(5.6+y)/2,Math.sin(a)*d,fr,4)}

const little=sc.children.filter(o=>o.userData.small);

/* ২) ফোন অনুযায়ী গ্রাফিক্সের মান */
const LEVELS=[{pr:1.6,shadow:true,far:210},{pr:1.35,shadow:false,far:170},{pr:1,shadow:false,far:140},{pr:.75,shadow:false,far:115}];
let level=matchMedia('(pointer:coarse)').matches?1:0;
const quality=()=>{const L=LEVELS[level];ren.setPixelRatio(Math.min(devicePixelRatio,L.pr));ren.setSize(innerWidth,innerHeight);sun.castShadow=L.shadow;sc.fog.near=L.far*.45;sc.fog.far=L.far};
quality();

/* ৩) দূরের জিনিস আঁকা বন্ধ */
const cull=()=>{const p=P.position,far=LEVELS[level].far,d=o=>Math.hypot(o.x-p.x,o.z-p.z);
 Object.values(cells).forEach(c=>{const v=d(c)<far+SIZE*.7;c.made.forEach(m=>m.visible=v)});
 people.forEach(o=>o.visible=d(o.position)<far*.55);
 vil.forEach(v=>{const n=d(v.g.position);v.g.children.forEach(c=>{if(c.isSprite)c.visible=n<32&&n>3.5})});
 trf.forEach(t=>t.m.visible=d(t.m.position)<far*.8);
 little.forEach(o=>o.visible=d(o.position)<60);
 crops.forEach(i=>i.mesh.crops.visible=d(i)<far*.5)};

/* ছোট ম্যাপ সেকেন্ডে ৮ বার আঁকলেই যথেষ্ট */
const _map=drawMap;let mapAt=0;drawMap=()=>{const n=performance.now();if(n-mapAt>120){mapAt=n;_map()}};

let cullT=1,frames=0,since=0,prev=0,warm=4;
const _step=extraStep;
extraStep=dt=>{_step(dt);
 if((cullT+=dt)>.3){cullT=0;cull()}
 const now=performance.now(),gap=(now-prev)/1000;prev=now;
 if(!started||gap>.5){frames=since=0;return}
 frames++;since+=gap;
 if(since>3){const fps=frames/since;frames=since=0;if(warm>0)warm-=3;else if(fps<40&&level<LEVELS.length-1){level++;quality();warm=3}}};

/* ৪) গ্রাফিক্স আটকে গেলে বা ভুল হলে খেলা বাঁচিয়ে আবার চালু */
ren.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();save();cloudSave();
 const o=el('div','start','<h1>একটু থামল</h1><p>ফোনের মেমরিতে চাপ পড়েছে।<br>আপনার খেলা সেভ করা আছে।</p><button id="again">▶ আবার চালু করুন</button>');$('again').onclick=()=>location.reload()});

/* টেলিগ্রামে কম্পন */
const _c=coin;coin=()=>{_c();buzz('medium')};
$('act').addEventListener('pointerdown',()=>buzz('light'));
}
</script>
</body></html>
